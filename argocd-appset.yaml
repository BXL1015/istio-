# ArgoCD 配置文件
# 包含 3 个部分：
# 1. ApplicationSet - 管理基线环境
# 2. ApplicationSet - 管理泳道环境（自动发现）
# 3. Application - 管理 Istio 路由配置

---
# 1. 基线环境
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: baseline
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: baseline
  template:
    metadata:
      name: '{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/bxl1015/gitops-lane-sim.git
        targetRevision: main
        path: 'k8s/{{name}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

---
# 2. 泳道环境（自动发现 k8s/swimlanes/* 目录）
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: swimlanes
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/bxl1015/gitops-lane-sim.git
        revision: main
        directories:
          - path: k8s/swimlanes/*
  template:
    metadata:
      name: 'swimlane-{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/bxl1015/gitops-lane-sim.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

---
# 3. Istio 路由配置
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-routing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bxl1015/gitops-lane-sim.git
    targetRevision: main
    path: k8s/istio
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
