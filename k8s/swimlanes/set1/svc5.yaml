apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc5-set1
  labels:
    app: svc5
    env: set1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc5
      env: set1
  template:
    metadata:
      labels:
        app: svc5
        env: set1
    spec:
      containers:
        - name: svc5
          image: ghcr.io/bxl1015/gitops-lane-svc5:main
          imagePullPolicy: Always
          env:
            - name: SERVICE_NAME
              value: svc5
            - name: SERVICE_ENV
              value: set1
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 64Mi
          ports:
            - name: http
              containerPort: 9000
