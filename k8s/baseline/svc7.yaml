apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc7
  labels:
    app: svc7
    env: baseline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc7
      env: baseline
  template:
    metadata:
      labels:
        app: svc7
        env: baseline
    spec:
      containers:
        - name: svc7
          image: ghcr.io/bxl1015/gitops-lane-svc7:main
          imagePullPolicy: Always
          env:
            - name: SERVICE_NAME
              value: svc7
            - name: SERVICE_ENV
              value: baseline
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 64Mi
          ports:
            - name: http
              containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: svc7
  labels:
    app: svc7
spec:
  selector:
    app: svc7
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
