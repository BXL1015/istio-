apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc11
  labels:
    app: svc11
    env: baseline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc11
      env: baseline
  template:
    metadata:
      labels:
        app: svc11
        env: baseline
    spec:
      containers:
        - name: svc11
          image: ghcr.io/bxl1015/gitops-lane-svc11:main
          imagePullPolicy: Always
          env:
            - name: SERVICE_NAME
              value: svc11
            - name: SERVICE_ENV
              value: baseline
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 64Mi
          ports:
            - name: http
              containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: svc11
  labels:
    app: svc11
spec:
  selector:
    app: svc11
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
